[platformio]
; The 8" is the recommended build (README "Two builds"); the 15" is experimental
; and needs different LED geometry. A bare `pio run` must not silently produce
; 15" firmware for someone following the 8" instructions.
default_envs = esp32c3_v3_8inch
extra_configs = platformio.local.ini

[common]
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LED_DATA_PIN=10
  -D STATUS_LED_PIN=-1
  -D CENTER_PIXEL_ENABLED=1
  -D ENABLE_WIFI_UI=1
  -D ENABLE_NTP=1
  -D TEMP_SENSOR_ENABLED=0
  -D CLOCK_VARIANT_XIAO_ESP32C3=1
  -D WIFI_CONNECT_TIMEOUT_MS=20000
  ; Compile-time DEFAULT timezone only. Since v2.28.0 the zone is set at runtime
  ; in the web UI (Time & light -> Time zone) and stored in NVS, so a stranger
  ; never needs a compiler to fix the clock's timezone. This value is what a
  ; freshly-flashed or factory-reset unit starts on.
  -D NTP_TIMEZONE_TZ=\"MST7MDT,M3.2.0,M11.1.0\"
  -D LUX_SENSOR_ENABLED=1
  -D LUX_SENSOR_I2C_SDA=6
  -D LUX_SENSOR_I2C_SCL=7
  -D FIRMWARE_VERSION='"2.35.0"'
  -D BUTTON_UP_PIN=5
  -D BUTTON_DOWN_PIN=9

; --- 8" LED chain geometry ----------------------------------------------------
; 97 LEDs: the 60 + 24 + 12 rings, plus one centre pixel at the end.
; This is the whole chain. Every 8" build, including the maintainer's, is wired
; this way as of 2026-08-01.
;
; Historical note: this project used to support an extra "sacrificial" LED
; spliced in ahead of the rings, kept dark, whose only job was to re-drive the
; board's 3.3V data signal at a full 5V for the LEDs behind it. The maintainer's
; prototype carried one from early signal troubleshooting. It was removed on
; 2026-08-01 and the firmware support went with it. src/main.cpp keeps a
; plain-English explanation of what that trick does, what it does not do, and
; what bad logic levels look like - worth a read before wiring a long data run.
; If a run does misbehave, a 74AHCT125 buffer is the proper fix.
[led_chain]
chain_flags_8inch =
  -D CLOCK_PIXEL_COUNT=97
  -D CENTER_PIXEL_INDEX=96
  -D RING_PIXEL_OFFSET=0

; Overridden by platformio.local.ini (gitignored) with real credentials.
; See platformio.local.ini.example.
[wifi_secrets]
wifi_flags_8inch =
  -D WIFI_SSID=\"clock-ssid\"
  -D WIFI_PASSWORD=\"clock-password\"
wifi_flags_15inch =
  -D WIFI_SSID=\"clock-ssid\"
  -D WIFI_PASSWORD=\"clock-password\"

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool
build_flags =
  -Os
  -flto
lib_deps =
  adafruit/Adafruit NeoPixel @ 1.15.5
  adafruit/Adafruit VEML7700 Library @ 2.1.6
  tzapu/WiFiManager @ 2.0.17
  improv/Improv @ 1.2.6

[env:esp32c3_v3_8inch]
build_flags =
  ${common.build_flags}
  -D CLOCK_VARIANT_8INCH=1
  -D DEVICE_TITLE=\"esp32c3-v3-8inch\"
  -D DEVICE_HOSTNAME=\"esp32c3-v3-8inch\"
  ${wifi_secrets.wifi_flags_8inch}
  ${led_chain.chain_flags_8inch}
  -D DEFAULT_OUTER_RING_OFFSET=1
  ; LED current budget (H1). Usable LED share of the 8" unit's supply, in mA.
  ; Sized for a 5 V / 2 A source (leaves headroom for the ESP32 + WiFi peaks).
  -D MAX_LED_MILLIAMPS=1800

[env:esp32c3_v3_15inch]
build_flags =
  ${common.build_flags}
  -D CLOCK_VARIANT_15INCH=1
  -D DEVICE_TITLE=\"esp32c3-v3-15inch\"
  -D DEVICE_HOSTNAME=\"esp32c3-v3-15inch\"
  ${wifi_secrets.wifi_flags_15inch}
  -D CLOCK_PIXEL_COUNT=96
  -D CENTER_PIXEL_SEPARATE_OUTPUT=1
  -D CENTER_PIXEL_PIN=20
  -D CENTER_PIXEL_STRIP_COUNT=1
  -D CENTER_PIXEL_INDEX=0
  -D RING_PIXEL_OFFSET=0
  -D DEFAULT_OUTER_RING_OFFSET=0
  ; LED current budget (H1). The 15" unit is the one that browned out on
  ; 2026-07-08; keep this conservative until validated on the target supply.
  ; Raise it only if the unit runs a beefier PSU (e.g. a 4 A hub).
  -D MAX_LED_MILLIAMPS=1800
